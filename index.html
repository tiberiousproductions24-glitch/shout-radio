<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shout Radio</title>
<style>
  :root { --bg:#0b0b0f; --card:#16161d; --card-hi:#1f1f2a; --text:#f2f2f5; --muted:#8a8a99; --accent:#f5b301; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; padding:32px 16px 140px; }
  header { max-width:720px; margin:0 auto 28px; text-align:center; }
  header h1 { font-size:2.2rem; letter-spacing:.08em; text-transform:uppercase; }
  header h1 span { color:var(--accent); }
  header p { color:var(--muted); margin-top:6px; }
  ul { list-style:none; max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  li { display:flex; align-items:center; gap:16px; background:var(--card); border-radius:14px; padding:14px 16px; cursor:pointer; transition:background .15s; }
  li:hover { background:var(--card-hi); }
  li.active { background:var(--card-hi); box-shadow:inset 4px 0 0 var(--accent); }
  .num { width:24px; color:var(--muted); font-weight:600; text-align:right; }
  .play { flex:none; width:56px; height:56px; border-radius:50%; border:none; background:var(--accent); color:#111; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .play:hover { filter:brightness(1.1); }
  .info { flex:1; min-width:0; }
  .title { font-size:1.05rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .artist { color:var(--muted); font-size:.9rem; margin-top:2px; }
  .views { color:var(--accent); font-weight:600; font-size:.9rem; white-space:nowrap; }
  #bar { position:fixed; left:0; right:0; bottom:0; background:#111118; border-top:1px solid #23232e; padding:14px 20px; display:flex; align-items:center; gap:16px; }
  #bar .ctl { width:44px; height:44px; border-radius:50%; border:none; background:#23232e; color:var(--text); font-size:18px; cursor:pointer; }
  #bar #bigplay { width:60px; height:60px; background:var(--accent); color:#111; font-size:24px; }
  #now { flex:1; min-width:0; }
  #now .t { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #now .s { color:var(--muted); font-size:.85rem; }
  #progress { width:100%; height:4px; background:#23232e; border-radius:2px; margin-top:8px; overflow:hidden; }
  #progress div { height:100%; width:0; background:var(--accent); }
  #yt { position:absolute; width:1px; height:1px; left:-9999px; top:-9999px; }
</style>
</head>
<body>
<header>
  <h1>Shout <span>Radio</span></h1>
  <p>Top gospel shout tracks, tap to play</p>
</header>
<ul id="list"></ul>

<div id="bar">
  <button class="ctl" id="prev" title="Previous">&#9198;</button>
  <button class="ctl" id="bigplay" title="Play/Pause">&#9654;</button>
  <button class="ctl" id="next" title="Next">&#9197;</button>
  <div id="now"><div class="t">Nothing playing</div><div class="s">Pick a track</div><div id="progress"><div></div></div></div>
</div>
<div id="yt"></div>

<script>
const tracks = [
  { artist:"Korey Mickie", title:"Jump in Praise", id:"CSFuOEI_-J4", views:"2.0M" },
  { artist:"Korey Mickie", title:"The Praise", id:"TqzTJ8TiUy4", views:"844K" },
  { artist:"Korey Mickie", title:"Encouragement Praise", id:"qAOnZ_oDEPM", views:"537K" },
  { artist:"Korey Mickie", title:"Any Day Now", id:"FG3mg_b5mdU", views:"517K" },
  { artist:"Korey Mickie", title:"A Promise Praise", id:"yeypCpvrbmE", views:"381K" },
  { artist:"Korey Mickie", title:"Overflow (Live Through It)", id:"JoKHX4KGr58", views:"367K" },
  { artist:"Korey Mickie", title:"All Is Well", id:"TBO4X8V-pgM", views:"466K" },
  { artist:"Korey Mickie", title:"Let The People Praise", id:"gTCjp2KBd54", views:"359K" },
  { artist:"Chicago Mass Choir", title:"Holy Ghost Power", id:"Dv5kDp-yShw", views:"2.2M" },
  { artist:"Jarell Smalls & Company", title:"Prayer Room", id:"1Pb04tYeNCw", views:"3.9M" }
];
const PLAY="\u25B6", PAUSE="\u275A\u275A";
let player, ready=false, current=-1, playing=false;
const list=document.getElementById('list');
tracks.forEach((t,i)=>{
  const li=document.createElement('li');
  li.innerHTML=`<span class="num">${i+1}</span><button class="play">${PLAY}</button>
    <div class="info"><div class="title">${t.title}</div><div class="artist">${t.artist}</div></div>
    <span class="views">${t.views} views</span>`;
  li.onclick=()=>toggle(i);
  list.appendChild(li);
});
function render(){
  [...list.children].forEach((li,i)=>{
    li.classList.toggle('active',i===current);
    li.querySelector('.play').textContent=(i===current&&playing)?PAUSE:PLAY;
  });
  document.getElementById('bigplay').innerHTML=playing?PAUSE:PLAY;
  if(current>=0){
    document.querySelector('#now .t').textContent=tracks[current].title;
    document.querySelector('#now .s').textContent=tracks[current].artist+' \u00B7 '+tracks[current].views+' views';
  }
}
function toggle(i){
  if(!ready) return;
  if(i===current){ playing?player.pauseVideo():player.playVideo(); return; }
  current=i; player.loadVideoById(tracks[i].id); render();
}
document.getElementById('bigplay').onclick=()=>toggle(current<0?0:current);
document.getElementById('next').onclick=()=>toggle((current+1)%tracks.length);
document.getElementById('prev').onclick=()=>toggle((current-1+tracks.length)%tracks.length);

const tag=document.createElement('script'); tag.src="https://www.youtube.com/iframe_api"; document.head.appendChild(tag);
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt',{ height:'1', width:'1', videoId:tracks[0].id,
    playerVars:{ autoplay:0, controls:0, playsinline:1 },
    events:{
      onReady:()=>{ ready=true; },
      onStateChange:e=>{
        playing=(e.data===YT.PlayerState.PLAYING);
        if(e.data===YT.PlayerState.ENDED) toggle((current+1)%tracks.length);
        render();
      }
    }});
}
setInterval(()=>{
  if(ready&&player.getDuration&&player.getDuration()>0){
    document.querySelector('#progress div').style.width=(player.getCurrentTime()/player.getDuration()*100)+'%';
  }
},500);
</script>
</body>
</html>
